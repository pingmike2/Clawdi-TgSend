name: 📨 Tg Bot Message

on:
  schedule:
    # 每 2 天 09:20 UTC = 北京时间 17:20；错开整点，避免 schedule 高峰延迟
    - cron: '20 9 */2 * *'
  workflow_dispatch:
    inputs:
      tg_target:
        description: '目标 bot 用户名（留空用默认/Secrets）'
        required: false
        default: ''
      tg_msg_text:
        description: '消息模板，{time} 会被替换为北京时间（留空用默认）'
        required: false
        default: ''

permissions:
  contents: write
  actions: write

concurrency:
  group: Tg_Send
  cancel-in-progress: false

env:
  PRIVATE_REPO: pingmike2/clawdi-send
  PROJECT_DIR: clawdi-send
  KEEPALIVE_FILE: time.txt
  TG_TARGET: ${{ vars.TG_TARGET || 'ClawdiAgent1Bot' }}
  TG_MSG_TEXT: ${{ vars.TG_MSG_TEXT || '纯测试，现在北京时间 {time}' }}
  TG_TIME_FMT: ${{ vars.TG_TIME_FMT || '%Y-%m-%d %H:%M:%S' }}

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出公开仓库
        uses: actions/checkout@v4

      - name: 检出私有仓库
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: main
          path: ${{ env.PROJECT_DIR }}
          fetch-depth: 1

      - name: 校验 TG 凭据
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
        run: |
          python3 - <<'PY'
          import os
          missing = [k for k in ("TG_API_ID", "TG_API_HASH", "TG_SESSION") if not os.environ.get(k, "").strip()]
          if missing:
              raise SystemExit(f"缺少 Secrets: {', '.join(missing)}")
          if not os.environ["TG_API_ID"].strip().isdigit():
              raise SystemExit("TG_API_ID 必须是数字")
          print("TG 凭据预检通过（内容已隐藏）")
          PY

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: ${{ env.PROJECT_DIR }}/requirements.txt

      - name: 安装依赖
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt -q
          # 代理带认证时需要 python-socks；requests 用于报告推送
          pip install python-socks requests -q

      - name: 启动 sing-box 代理（节点协议时）
        id: singbox
        if: env.TG_PROXY != ''
        run: |
          set -e
          cd "$PROJECT_DIR"
          # 判断是否节点协议（vless/vmess/trojan/ss/hy2/tuic/anytls），socks5/http 不经 sing-box
          if echo "$TG_PROXY" | grep -qiE '^(vless|vmess|trojan|ss|hysteria2|hy2|tuic|anytls)://'; then
            echo "检测到节点协议，生成 sing-box 配置..."
            python3 gen_singbox_config.py
            test -f sing-box_config.json
            # 安装 sing-box（官方 apt 源）
            curl -fsSL https://sing-box.app/gpg.key -o /tmp/sb.gpg
            sudo gpg --dearmor -o /etc/apt/keyrings/sagernet.gpg /tmp/sb.gpg 2>/dev/null || \
              { sudo mkdir -p /etc/apt/keyrings && sudo gpg --dearmor -o /etc/apt/keyrings/sagernet.gpg /tmp/sb.gpg; }
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/sagernet.gpg] https://deb.sagernet.org/ * *" | sudo tee /etc/apt/sources.list.d/sagernet.list > /dev/null
            sudo apt-get update -qq
            sudo apt-get install -y -qq sing-box
            sing-box version
            # 校验配置 + 前台启动
            sing-box check -c sing-box_config.json
            nohup sing-box run -c sing-box_config.json > sing-box.log 2>&1 &
            echo $! > sing-box.pid
            sleep 3
            kill -0 $(cat sing-box.pid) && echo "sing-box 已启动"
            # 等待端口就绪
            for i in $(seq 1 15); do
              if python3 -c "import socket,sys; s=socket.socket(); s.settimeout(1); sys.exit(0 if s.connect_ex(('127.0.0.1',10808))==0 else 1)"; then
                echo "端口 10808 就绪"
                break
              fi
              sleep 1
            done
            echo "socks=socks5://127.0.0.1:10808" >> "$GITHUB_OUTPUT"
            echo "enabled=1" >> "$GITHUB_OUTPUT"
          else
            echo "socks5/http 直连代理，跳过 sing-box"
            echo "enabled=0" >> "$GITHUB_OUTPUT"
          fi

      - name: 发送消息
        id: send
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          TG_PROXY: ${{ secrets.TG_PROXY }}
          TG_PROXY_SOCKS: ${{ steps.singbox.outputs.socks }}
          REPORT_BOT_TOKEN: ${{ secrets.REPORT_BOT_TOKEN }}
          REPORT_CHAT_ID: ${{ secrets.REPORT_CHAT_ID }}
          TG_TARGET: ${{ inputs.tg_target != '' && inputs.tg_target || env.TG_TARGET }}
          TG_MSG_TEXT: ${{ inputs.tg_msg_text != '' && inputs.tg_msg_text || env.TG_MSG_TEXT }}
          TG_TIME_FMT: ${{ env.TG_TIME_FMT }}
        run: |
          set +e
          python3 -u tg_send.py
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0   # 保活步骤永远执行，失败状态由保活文件和 summary 呈现

      - name: 停止 sing-box
        if: steps.singbox.outputs.enabled == '1'
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f sing-box.pid ] && kill -0 $(cat sing-box.pid) 2>/dev/null; then
            kill $(cat sing-box.pid) && echo "sing-box 已停止"
          fi
          tail -5 sing-box.log || true

      - name: 🕒 更新时间
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "$(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S')" > time.txt
          git add time.txt
          if git diff --cached --quiet; then
            echo "No need to commit"
          else
            git commit -m "⏱️ Auto Update by Github Actions $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S')"
            git push origin main
          fi

      - name: 🧹 清理旧的工作流运行记录
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh run list --workflow="${{ github.workflow }}" --limit=100 --json databaseId --jq '.[].databaseId')
          count=0
          for run_id in $runs; do
            count=$((count + 1))
            if [ $count -gt 1 ]; then
              echo "删除运行记录: $run_id"
              gh run delete $run_id || true
            fi
          done

      - name: 结果摘要
        if: always()
        run: |
          if [ "${{ steps.send.outputs.rc }}" = "0" ]; then
            echo "✅ 消息发送成功" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ 消息发送失败 (rc=${{ steps.send.outputs.rc }})，请检查上方日志" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f time.txt ]; then cat time.txt >> "$GITHUB_STEP_SUMMARY"; fi
