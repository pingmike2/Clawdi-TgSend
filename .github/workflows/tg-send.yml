name: 📨 Tg Bot Message

on:
  schedule:
    # 每 2 天 09:20 UTC = 北京时间 17:20；错开整点，避免 schedule 高峰延迟
    - cron: '20 9 */2 * *'
  workflow_dispatch:
    inputs:
      tg_target:
        description: '目标 bot 用户名（留空用默认/Secrets）'
        required: false
        default: ''
      tg_msg_text:
        description: '消息模板，{time} 会被替换为北京时间（留空用默认）'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: Tg_Send
  cancel-in-progress: false

env:
  PRIVATE_REPO: pingmike2/clawdi-send
  PROJECT_DIR: clawdi-send
  TG_TARGET: ${{ vars.TG_TARGET || 'ClawdiAgent1Bot' }}
  TG_MSG_TEXT: ${{ vars.TG_MSG_TEXT || '纯测试，现在北京时间 {time}' }}
  TG_TIME_FMT: ${{ vars.TG_TIME_FMT || '%Y-%m-%d %H:%M:%S' }}

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出公开仓库
        uses: actions/checkout@v4

      - name: 检出私有仓库
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: main
          path: ${{ env.PROJECT_DIR }}
          fetch-depth: 1

      - name: 校验 TG 凭据
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
        run: |
          python3 - <<'PY'
          import os, sys
          missing = [k for k in ("TG_API_ID", "TG_API_HASH", "TG_SESSION") if not os.environ.get(k, "").strip()]
          if missing:
              raise SystemExit(f"缺少 Secrets: {', '.join(missing)}")
          if not os.environ["TG_API_ID"].strip().isdigit():
              raise SystemExit("TG_API_ID 必须是数字")
          print("TG 凭据预检通过（内容已隐藏）")
          PY

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: ${{ env.PROJECT_DIR }}/requirements.txt

      - name: 安装依赖
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt -q

      - name: 发送消息
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          TG_TARGET: ${{ inputs.tg_target != '' && inputs.tg_target || env.TG_TARGET }}
          TG_MSG_TEXT: ${{ inputs.tg_msg_text != '' && inputs.tg_msg_text || env.TG_MSG_TEXT }}
          TG_TIME_FMT: ${{ env.TG_TIME_FMT }}
        run: python3 -u tg_send.py
